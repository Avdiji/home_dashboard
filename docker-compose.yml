services:
  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - HOME_DASHBOARD_DB=/data/home_dashboard.db
    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - backend-db:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/persons"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - BACKEND_HOST=backend
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  chromium:
    container_name: chromium
    build:
      context: ./kiosk
      dockerfile: Dockerfile
    devices:
      - /dev/dri:/dev/dri
    environment:
      - DISPLAY=${DISPLAY:-:0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    shm_size: "1gb"
    command: ["http://frontend:5173"]
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started

volumes:
  go-mod-cache:
  go-build-cache:
  backend-db:
  frontend-node-modules:
