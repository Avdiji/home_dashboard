asyncapi: 3.0.0
info:
  title: Home Dashboard — Backend API
  version: 0.1.0
  description: |
    Realtime contract for the Home Dashboard backend.

    Two layers:

    1. **Commands (client → server)** — one message per noop mutation declared on
       the Zustand stores (`src/store/*_store.js`). The noop signature *is* the
       command payload spec; field names are snake_case to match the backend
       shape the DTOs in `core/dto/` already parse. When the backend lands, the
       store action body fires the request — the call sites already pass the
       right args, so only the body needs filling.

    2. **Events (server → client)** — entity-change broadcasts pushed over a
       single websocket. The "websocket stage" mentioned throughout the codebase
       applies these by calling the matching store action / `set()`, so every
       subscriber in every client re-renders. The sender of a command also
       receives its resulting event and applies it the same way — commands are
       fire-and-forget; the server is the single source of truth, so the created/
       updated id comes back in the broadcast, not a reply.

    **Out of scope**: initial entity loads. Seeds (`core/seeds/`) are swapped for
    REST `GET` fetches on mount when the backend lands; those are plain HTTP, not
    message-driven, and are documented separately. Weather is a third-party API
    (Open-Meteo), not this backend.

    **ID type**: seeds use incrementing integers (`1, 2, 3 …`). The real backend
    may switch to UUIDs; the schemas below use `integer` to match the current
    seeds — change `id` to `string` `format: uuid` in one place if it switches.

    **Entity shapes** below are the snake_case backend payload the DTOs parse
    (`PersonDTO`, `EventDTO`, `ChecklistDTO`, `ChecklistItemDTO`, `RecipeDTO`,
    `MealDTO`). Note: `ChecklistItemDTO` reads `itemName` in camelCase (not
    `item_name`) — that field name is preserved here to match the existing DTO.

defaultContentType: application/json

servers:
  production:
    host: dashboard.example.com
    pathname: /ws
    protocol: ws
    description: Single persistent websocket carrying all command + event messages.
  development:
    host: localhost:8080
    pathname: /ws
    protocol: ws

channels:
  commands:
    address: commands
    description: |
      Client → server mutation commands. One message per store noop. Each
      command is fire-and-forget: the server validates, persists, and broadcasts
      the resulting entity event on the `events` channel (which the sender also
      consumes). A client-generated `requestId` is echoed in the broadcast so the
      originating client can correlate optimistic state if it wants to; it is
      optional and the server ignores it for persistence.
    messages:
      person.add:
        $ref: "#/components/messages/person.add"
      person.update:
        $ref: "#/components/messages/person.update"
      person.delete:
        $ref: "#/components/messages/person.delete"
      event.add:
        $ref: "#/components/messages/event.add"
      event.update:
        $ref: "#/components/messages/event.update"
      event.delete:
        $ref: "#/components/messages/event.delete"
      checklist.add:
        $ref: "#/components/messages/checklist.add"
      checklist.updateTitle:
        $ref: "#/components/messages/checklist.updateTitle"
      checklist.toggleAssignee:
        $ref: "#/components/messages/checklist.toggleAssignee"
      checklist.delete:
        $ref: "#/components/messages/checklist.delete"
      checklist.item.add:
        $ref: "#/components/messages/checklist.item.add"
      checklist.item.toggle:
        $ref: "#/components/messages/checklist.item.toggle"
      checklist.item.delete:
        $ref: "#/components/messages/checklist.item.delete"
      recipe.add:
        $ref: "#/components/messages/recipe.add"
      recipe.update:
        $ref: "#/components/messages/recipe.update"
      recipe.delete:
        $ref: "#/components/messages/recipe.delete"
      meal.add:
        $ref: "#/components/messages/meal.add"
      meal.delete:
        $ref: "#/components/messages/meal.delete"

  events:
    address: events
    description: |
      Server → client entity-change broadcasts. Every connected client —
      including the one whose command caused the change — receives these and
      applies them by calling the matching Zustand store action / `set()`.
      `created` and `updated` carry the full current entity in `data`; `deleted`
      carries only the id (`data` is null). Item events additionally carry
      `listId` so a client knows which list owns the item.
    messages:
      person.created:
        $ref: "#/components/messages/person.created"
      person.updated:
        $ref: "#/components/messages/person.updated"
      person.deleted:
        $ref: "#/components/messages/person.deleted"
      event.created:
        $ref: "#/components/messages/event.created"
      event.updated:
        $ref: "#/components/messages/event.updated"
      event.deleted:
        $ref: "#/components/messages/event.deleted"
      checklist.created:
        $ref: "#/components/messages/checklist.created"
      checklist.updated:
        $ref: "#/components/messages/checklist.updated"
      checklist.deleted:
        $ref: "#/components/messages/checklist.deleted"
      checklist_item.created:
        $ref: "#/components/messages/checklist_item.created"
      checklist_item.updated:
        $ref: "#/components/messages/checklist_item.updated"
      checklist_item.deleted:
        $ref: "#/components/messages/checklist_item.deleted"
      recipe.created:
        $ref: "#/components/messages/recipe.created"
      recipe.updated:
        $ref: "#/components/messages/recipe.updated"
      recipe.deleted:
        $ref: "#/components/messages/recipe.deleted"
      meal.created:
        $ref: "#/components/messages/meal.created"
      meal.deleted:
        $ref: "#/components/messages/meal.deleted"

operations:
  sendCommand:
    action: send
    channel:
      $ref: "#/channels/commands"
    summary: Client sends a mutation command.
    messages:
      - $ref: "#/channels/commands/messages/person.add"
      - $ref: "#/channels/commands/messages/person.update"
      - $ref: "#/channels/commands/messages/person.delete"
      - $ref: "#/channels/commands/messages/event.add"
      - $ref: "#/channels/commands/messages/event.update"
      - $ref: "#/channels/commands/messages/event.delete"
      - $ref: "#/channels/commands/messages/checklist.add"
      - $ref: "#/channels/commands/messages/checklist.updateTitle"
      - $ref: "#/channels/commands/messages/checklist.toggleAssignee"
      - $ref: "#/channels/commands/messages/checklist.delete"
      - $ref: "#/channels/commands/messages/checklist.item.add"
      - $ref: "#/channels/commands/messages/checklist.item.toggle"
      - $ref: "#/channels/commands/messages/checklist.item.delete"
      - $ref: "#/channels/commands/messages/recipe.add"
      - $ref: "#/channels/commands/messages/recipe.update"
      - $ref: "#/channels/commands/messages/recipe.delete"
      - $ref: "#/channels/commands/messages/meal.add"
      - $ref: "#/channels/commands/messages/meal.delete"

  receiveEvent:
    action: receive
    channel:
      $ref: "#/channels/events"
    summary: Client receives an entity-change broadcast.
    messages:
      - $ref: "#/channels/events/messages/person.created"
      - $ref: "#/channels/events/messages/person.updated"
      - $ref: "#/channels/events/messages/person.deleted"
      - $ref: "#/channels/events/messages/event.created"
      - $ref: "#/channels/events/messages/event.updated"
      - $ref: "#/channels/events/messages/event.deleted"
      - $ref: "#/channels/events/messages/checklist.created"
      - $ref: "#/channels/events/messages/checklist.updated"
      - $ref: "#/channels/events/messages/checklist.deleted"
      - $ref: "#/channels/events/messages/checklist_item.created"
      - $ref: "#/channels/events/messages/checklist_item.updated"
      - $ref: "#/channels/events/messages/checklist_item.deleted"
      - $ref: "#/channels/events/messages/recipe.created"
      - $ref: "#/channels/events/messages/recipe.updated"
      - $ref: "#/channels/events/messages/recipe.deleted"
      - $ref: "#/channels/events/messages/meal.created"
      - $ref: "#/channels/events/messages/meal.deleted"

components:
  schemas:
    # ---- shared ----
    requestId:
      type: string
      format: uuid
      description: |
        Optional client-generated correlation id. The server echoes it back in
        the broadcast caused by this command so the originating client can
        reconcile optimistic state. Ignored for persistence.
    frequency:
      type: string
      enum: [none, daily, weekly, monthly]
      description: Recurrence. Mirrors `core/frequency.js` constants.
    dateOnly:
      type: string
      format: date
      description: ISO `YYYY-MM-DD` (date-only, no time/offset). Used for birthdays and meal dates.
    dateTime:
      type: string
      format: date-time
      description: ISO 8601 / RFC 3339 timestamp. Used for event start/end.

    # ---- entities (snake_case backend shape, per the DTOs) ----
    Person:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id:
          type: integer
          description: Matches seed integers; switch to `uuid` if backend changes.
        name:
          type: string
          minLength: 1
        birthday:
          allOf:
            - $ref: "#/components/schemas/dateOnly"
          nullable: true
          description: ISO date or null when unset.
    Event:
      type: object
      required: [id, title, start_at, end_at, person_ids, frequency]
      additionalProperties: false
      properties:
        id: { type: integer }
        title: { type: string, minLength: 1 }
        description: { type: string, default: "" }
        location: { type: string, default: "" }
        start_at: { $ref: "#/components/schemas/dateTime" }
        end_at: { $ref: "#/components/schemas/dateTime" }
        person_ids:
          type: array
          items: { type: integer }
          default: []
        frequency:
          allOf:
            - $ref: "#/components/schemas/frequency"
          default: none
    ChecklistItem:
      type: object
      required: [id, itemName, is_done]
      additionalProperties: false
      description: |
        Field name is `itemName` (camelCase), not `item_name` — preserved to
        match `ChecklistItemDTO` which reads it as-is. Fix the DTO + this schema
        together if normalized to snake_case.
      properties:
        id: { type: integer }
        itemName: { type: string, minLength: 1 }
        is_done: { type: boolean }
    Checklist:
      type: object
      required: [id, title, person_ids, items]
      additionalProperties: false
      properties:
        id: { type: integer }
        title: { type: string, minLength: 1 }
        person_ids:
          type: array
          items: { type: integer }
          default: []
        items:
          type: array
          items: { $ref: "#/components/schemas/ChecklistItem" }
          default: []
    Recipe:
      type: object
      required: [id, title, ingredients]
      additionalProperties: false
      properties:
        id: { type: integer }
        title: { type: string, minLength: 1 }
        description: { type: string, default: "" }
        ingredients:
          type: array
          items: { type: string }
          default: []
        servings: { type: integer, nullable: true, minimum: 1 }
        minutes: { type: integer, nullable: true, minimum: 1 }
    Meal:
      type: object
      required: [id, date, recipe_id, label]
      additionalProperties: false
      properties:
        id: { type: integer }
        date: { $ref: "#/components/schemas/dateOnly" }
        recipe_id:
          type: integer
          nullable: true
          description: Linked recipe id, or null for a free-text dish.
        label:
          type: string
          default: ""
          description: Dish name when `recipe_id` is null; empty when a recipe is linked.

    # ---- command payload schemas ----
    person.add.payload:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        birthday:
          allOf: [{$ref: "#/components/schemas/dateOnly"}]
          nullable: true
    person.update.payload:
      type: object
      additionalProperties: false
      required: [personId]
      properties:
        personId: { type: integer }
        name: { type: string, minLength: 1 }
        birthday:
          allOf: [{$ref: "#/components/schemas/dateOnly"}]
          nullable: true
      description: |
        Patch. Mirrors `updatePerson(personId, { name, birthday })` — only
        included fields are updated.
    person.delete.payload:
      type: object
      additionalProperties: false
      required: [personId]
      properties:
        personId: { type: integer }

    event.add.payload:
      type: object
      additionalProperties: false
      required: [title, start_at, end_at]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string, default: "" }
        location: { type: string, default: "" }
        start_at: { $ref: "#/components/schemas/dateTime" }
        end_at: { $ref: "#/components/schemas/dateTime" }
        person_ids:
          type: array
          items: { type: integer }
          default: []
        frequency:
          allOf: [{$ref: "#/components/schemas/frequency"}]
          default: none
    event.update.payload:
      type: object
      additionalProperties: false
      required: [eventId]
      properties:
        eventId: { type: integer }
        title: { type: string, minLength: 1 }
        description: { type: string }
        location: { type: string }
        start_at: { $ref: "#/components/schemas/dateTime" }
        end_at: { $ref: "#/components/schemas/dateTime" }
        person_ids:
          type: array
          items: { type: integer }
        frequency: { $ref: "#/components/schemas/frequency" }
      description: |
        Patch — mirrors `updateEvent(eventId, patch)`. Editing a recurring event
        updates the whole series (per `recurrence.js`); per-occurrence exceptions
        are not built.
    event.delete.payload:
      type: object
      additionalProperties: false
      required: [eventId]
      properties:
        eventId: { type: integer }

    checklist.add.payload:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        person_ids:
          type: array
          items: { type: integer }
          default: []
    checklist.updateTitle.payload:
      type: object
      additionalProperties: false
      required: [listId, title]
      properties:
        listId: { type: integer }
        title: { type: string, minLength: 1 }
    checklist.toggleAssignee.payload:
      type: object
      additionalProperties: false
      required: [listId, personId]
      properties:
        listId: { type: integer }
        personId: { type: integer }
      description: |
        Toggles membership — adds the person if absent, removes if present.
        Server broadcasts a full `checklist.updated` event with the new
        `person_ids`.
    checklist.delete.payload:
      type: object
      additionalProperties: false
      required: [listId]
      properties:
        listId: { type: integer }
    checklist.item.add.payload:
      type: object
      additionalProperties: false
      required: [listId, label]
      properties:
        listId: { type: integer }
        label: { type: string, minLength: 1 }
      description: Server assigns the item id and broadcasts `checklist_item.created`.
    checklist.item.toggle.payload:
      type: object
      additionalProperties: false
      required: [listId, itemId]
      properties:
        listId: { type: integer }
        itemId: { type: integer }
      description: Flips `is_done`. Server broadcasts `checklist_item.updated`.
    checklist.item.delete.payload:
      type: object
      additionalProperties: false
      required: [listId, itemId]
      properties:
        listId: { type: integer }
        itemId: { type: integer }

    recipe.add.payload:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string, default: "" }
        ingredients:
          type: array
          items: { type: string }
          default: []
        servings: { type: integer, nullable: true, minimum: 1 }
        minutes: { type: integer, nullable: true, minimum: 1 }
    recipe.update.payload:
      type: object
      additionalProperties: false
      required: [recipeId]
      properties:
        recipeId: { type: integer }
        title: { type: string, minLength: 1 }
        description: { type: string }
        ingredients:
          type: array
          items: { type: string }
        servings: { type: integer, nullable: true, minimum: 1 }
        minutes: { type: integer, nullable: true, minimum: 1 }
      description: Patch — mirrors `updateRecipe(recipeId, { … })`.
    recipe.delete.payload:
      type: object
      additionalProperties: false
      required: [recipeId]
      properties:
        recipeId: { type: integer }

    meal.add.payload:
      type: object
      additionalProperties: false
      required: [date]
      properties:
        date: { $ref: "#/components/schemas/dateOnly" }
        recipe_id:
          type: integer
          nullable: true
        label:
          type: string
          default: ""
      description: |
        A meal links to a recipe (`recipe_id` set, label derived) or is free-text
        (`label` only, `recipe_id` null). A recipe is not mandatory.
    meal.delete.payload:
      type: object
      additionalProperties: false
      required: [mealId]
      properties:
        mealId: { type: integer }
      description: |
        No `meal.update` — to change a meal, delete + add (matches the store,
        which exposes only `addMeal` / `removeMeal`).

    # ---- event envelope ----
    eventEnvelope:
      type: object
      required: [type, entity, id]
      additionalProperties: false
      properties:
        type:
          type: string
          description: "<entity>.<created|updated|deleted>"
        entity:
          type: string
          enum: [person, event, checklist, checklist_item, recipe, meal]
        id:
          type: integer
          description: The changed entity's id. For checklist_item this is the item id.
        listId:
          type: integer
          description: Present only on checklist_item events — the owning list.
        requestId:
          $ref: "#/components/schemas/requestId"
        data:
          description: |
            Full current entity for `created`/`updated`; null for `deleted`.
            Type depends on `entity` (Person / Event / Checklist /
            ChecklistItem / Recipe / Meal).
          oneOf:
            - $ref: "#/components/schemas/Person"
            - $ref: "#/components/schemas/Event"
            - $ref: "#/components/schemas/Checklist"
            - $ref: "#/components/schemas/ChecklistItem"
            - $ref: "#/components/schemas/Recipe"
            - $ref: "#/components/schemas/Meal"

  messages:
    # ===== commands (client → server) =====
    person.add:
      payload:
        type: object
        required: [action, payload]
        additionalProperties: false
        properties:
          action: { type: string, const: "person.add" }
          requestId: { $ref: "#/components/schemas/requestId" }
          payload: { $ref: "#/components/schemas/person.add.payload" }
    person.update:
      payload:
        type: object
        required: [action, payload]
        additionalProperties: false
        properties:
          action: { type: string, const: "person.update" }
          requestId: { $ref: "#/components/schemas/requestId" }
          payload: { $ref: "#/components/schemas/person.update.payload" }
    person.delete:
      payload:
        type: object
        required: [action, payload]
        additionalProperties: false
        properties:
          action: { type: string, const: "person.delete" }
          requestId: { $ref: "#/components/schemas/requestId" }
          payload: { $ref: "#/components/schemas/person.delete.payload" }

    event.add:
      payload:
        type: object
        required: [action, payload]
        additionalProperties: false
        properties:
          action: { type: string, const: "event.add" }
          requestId: { $ref: "#/components/schemas/requestId" }
          payload: { $ref: "#/components/schemas/event.add.payload" }
    event.update:
      payload:
        type: object
        required: [action, payload]
        additionalProperties: false
        properties:
          action: { type: string, const: "event.update" }
          requestId: { $ref: "#/components/schemas/requestId" }
          payload: { $ref: "#/components/schemas/event.update.payload" }
    event.delete:
      payload:
        type: object
        required: [action, payload]
        additionalProperties: false
        properties:
          action: { type: string, const: "event.delete" }
          requestId: { $ref: "#/components/schemas/requestId" }
          payload: { $ref: "#/components/schemas/event.delete.payload" }

    checklist.add:
      payload:
        type: object
        required: [action, payload]
        additionalProperties: false
        properties:
          action: { type: string, const: "checklist.add" }
          requestId: { $ref: "#/components/schemas/requestId" }
          payload: { $ref: "#/components/schemas/checklist.add.payload" }
    checklist.updateTitle:
      payload:
        type: object
        required: [action, payload]
        additionalProperties: false
        properties:
          action: { type: string, const: "checklist.updateTitle" }
          requestId: { $ref: "#/components/schemas/requestId" }
          payload: { $ref: "#/components/schemas/checklist.updateTitle.payload" }
    checklist.toggleAssignee:
      payload:
        type: object
        required: [action, payload]
        additionalProperties: false
        properties:
          action: { type: string, const: "checklist.toggleAssignee" }
          requestId: { $ref: "#/components/schemas/requestId" }
          payload: { $ref: "#/components/schemas/checklist.toggleAssignee.payload" }
    checklist.delete:
      payload:
        type: object
        required: [action, payload]
        additionalProperties: false
        properties:
          action: { type: string, const: "checklist.delete" }
          requestId: { $ref: "#/components/schemas/requestId" }
          payload: { $ref: "#/components/schemas/checklist.delete.payload" }
    checklist.item.add:
      payload:
        type: object
        required: [action, payload]
        additionalProperties: false
        properties:
          action: { type: string, const: "checklist.item.add" }
          requestId: { $ref: "#/components/schemas/requestId" }
          payload: { $ref: "#/components/schemas/checklist.item.add.payload" }
    checklist.item.toggle:
      payload:
        type: object
        required: [action, payload]
        additionalProperties: false
        properties:
          action: { type: string, const: "checklist.item.toggle" }
          requestId: { $ref: "#/components/schemas/requestId" }
          payload: { $ref: "#/components/schemas/checklist.item.toggle.payload" }
    checklist.item.delete:
      payload:
        type: object
        required: [action, payload]
        additionalProperties: false
        properties:
          action: { type: string, const: "checklist.item.delete" }
          requestId: { $ref: "#/components/schemas/requestId" }
          payload: { $ref: "#/components/schemas/checklist.item.delete.payload" }

    recipe.add:
      payload:
        type: object
        required: [action, payload]
        additionalProperties: false
        properties:
          action: { type: string, const: "recipe.add" }
          requestId: { $ref: "#/components/schemas/requestId" }
          payload: { $ref: "#/components/schemas/recipe.add.payload" }
    recipe.update:
      payload:
        type: object
        required: [action, payload]
        additionalProperties: false
        properties:
          action: { type: string, const: "recipe.update" }
          requestId: { $ref: "#/components/schemas/requestId" }
          payload: { $ref: "#/components/schemas/recipe.update.payload" }
    recipe.delete:
      payload:
        type: object
        required: [action, payload]
        additionalProperties: false
        properties:
          action: { type: string, const: "recipe.delete" }
          requestId: { $ref: "#/components/schemas/requestId" }
          payload: { $ref: "#/components/schemas/recipe.delete.payload" }

    meal.add:
      payload:
        type: object
        required: [action, payload]
        additionalProperties: false
        properties:
          action: { type: string, const: "meal.add" }
          requestId: { $ref: "#/components/schemas/requestId" }
          payload: { $ref: "#/components/schemas/meal.add.payload" }
    meal.delete:
      payload:
        type: object
        required: [action, payload]
        additionalProperties: false
        properties:
          action: { type: string, const: "meal.delete" }
          requestId: { $ref: "#/components/schemas/requestId" }
          payload: { $ref: "#/components/schemas/meal.delete.payload" }

    # ===== events (server → client) =====
    person.created:
      payload:
        allOf: [{$ref: "#/components/schemas/eventEnvelope"}]
        properties:
          type: { const: "person.created" }
          entity: { const: "person" }
          data: { $ref: "#/components/schemas/Person" }
    person.updated:
      payload:
        allOf: [{$ref: "#/components/schemas/eventEnvelope"}]
        properties:
          type: { const: "person.updated" }
          entity: { const: "person" }
          data: { $ref: "#/components/schemas/Person" }
    person.deleted:
      payload:
        allOf: [{$ref: "#/components/schemas/eventEnvelope"}]
        properties:
          type: { const: "person.deleted" }
          entity: { const: "person" }
          data: { nullable: true }

    event.created:
      payload:
        allOf: [{$ref: "#/components/schemas/eventEnvelope"}]
        properties:
          type: { const: "event.created" }
          entity: { const: "event" }
          data: { $ref: "#/components/schemas/Event" }
    event.updated:
